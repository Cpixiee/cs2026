version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2026_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cyberspace2026
      POSTGRES_DB: cyberspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cs2026_backend
    restart: always
    environment:
      PORT: "8080"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "cyberspace2026"
      DB_NAME: "cyberspace"
      DB_SSLMODE: "disable"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cs2026_frontend
    restart: always
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://cs2026.my.id"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: cs2026_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
